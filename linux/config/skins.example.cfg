# cs2_linux_skinchanger config
#
# One line per weapon: "<item definition index>: key=value key=value ..."
# Lines starting with # are comments. Reloaded automatically while the game
# is running - just save the file again.
#
# Keys:
#   paintkit  int    paint kit index (the "skin" itself)
#   seed      int    pattern seed
#   wear      float  0.0 (factory new) .. 1.0 (battle-scarred)
#   stattrak  int    kill count to display, or -1 for no StatTrak
#   name      "str"  custom name tag, optional, quoted
#
# Common item definition indices (from this repo's own sdk/weapon.cpp table):
#   1 deagle   2 elite      3 fiveseven  4 glock     7 ak47
#   8 aug      9 awp       10 famas     11 g3sg1    13 galilar
#  14 m249    16 m4a4      17 mac10     19 p90      23 mp5sd
#  24 ump45   25 xm1014    26 bizon     27 mag7     28 negev
#  29 sawedoff 30 tec9     32 hkp2000   33 mp7      34 mp9
#  35 nova    36 p250      38 scar20    39 sg553    40 ssg08
#  60 m4a1_s  61 usp_s     63 cz75a     64 revolver
#
# Example: AK-47 | Redline, factory new, seed 661
7: paintkit=282 seed=661 wear=0.01

# Example: AWP | Dragon Lore with a StatTrak count and a name tag
9: paintkit=344 seed=123 wear=0.10 stattrak=512 name="Howl"
